<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cardsharpener — Download</title>
    <meta
      name="description"
      content="Local-first poker hand tracker and replayer. Download for Mac and Windows."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="assets/sharpenerlogo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        var key = "cardsharpener.theme";
        var saved = null;
        try {
          saved = localStorage.getItem(key);
        } catch (e) {}
        var theme = saved === "light" || saved === "dark" ? saved : "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <header class="top">
      <div class="theme" role="group" aria-label="Colour theme">
        <button type="button" data-theme="light">Light</button>
        <button type="button" data-theme="dark">Dark</button>
      </div>
    </header>

    <main class="hero">
      <img
        class="logo"
        src="assets/sharpenerlogo.png"
        alt="Cardsharpener logo"
        width="220"
        height="150"
      />
      <h1>Cardsharpener</h1>
      <p class="pitch">
        Local-first poker hand tracker and replayer — import, browse, replay, and graph on your machine.
      </p>
      <div class="actions">
        <a
          class="btn btn-primary"
          href="https://github.com/lukefish591/cardsharpner/releases/latest/download/Cardsharpener.dmg"
        >
          Download for Mac
        </a>
        <a
          class="btn"
          href="https://github.com/lukefish591/cardsharpner/releases/latest/download/Cardsharpener.msi"
        >
          Download for Windows
        </a>
      </div>
      <p class="notes">
        <a href="https://github.com/lukefish591/cardsharpner/releases/latest">
          Release notes and checksums
        </a>
      </p>
    </main>

    <script>
      (function () {
        var key = "cardsharpener.theme";
        var root = document.documentElement;
        var buttons = document.querySelectorAll(".theme button");

        function paint(theme) {
          root.dataset.theme = theme;
          try {
            localStorage.setItem(key, theme);
          } catch (e) {}
          buttons.forEach(function (button) {
            button.setAttribute(
              "aria-pressed",
              button.getAttribute("data-theme") === theme ? "true" : "false"
            );
          });
        }

        buttons.forEach(function (button) {
          button.addEventListener("click", function () {
            paint(button.getAttribute("data-theme"));
          });
        });

        paint(root.dataset.theme === "light" ? "light" : "dark");
      })();
    </script>
  </body>
</html>
